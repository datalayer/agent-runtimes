[build-system]
requires = ["hatchling==1.21.1", "hatch-nodejs-version>=0.3.2", "pip>=26.1.2"]
build-backend = "hatchling.build"

[project]
name = "agent_runtimes"
description="Agent Runtimes"
keywords = []
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Provides the `acp` module, imported by the ACP routes, transports and
    # clients. It was never declared, so `import agent_runtimes` failed
    # wherever it was absent — reported by consumers as the package
    # being missing when it was installed and merely unimportable.
    "agent-client-protocol>=0.7.1",
    "agent-codemode",
    "agent-skills",
    "code-sandboxes",
    "croniter",
    "datalayer-core>=1.1.57",
    "fastapi",
    "filelock>=3.20.3",
    "httpx",
    "nbformat",
    "jupyter-server>=2.10,<3",
    "mcp>=1.10.1,<2",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.61b0,<0.62",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0,<2.0.0",
    "opentelemetry-instrumentation>=0.61b0,<0.62",
    "pydantic-ai-slim[mcp]>=2.21.0,<3",
    "pydantic-graph>=2.21.0,<3",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.3",
    "tiktoken>=0.5.0",
    "typer>=0.16.0",
    "urllib3>=2.6.3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/datalayer/agent-runtimes"
Documentation = "https://agent-runtimes.datalayer.tech"
Repository = "https://github.com/datalayer/agent-runtimes"
Issues = "https://github.com/datalayer/agent-runtimes/issues"
Changelog = "https://github.com/datalayer/agent-runtimes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.105.0,<1.0.0",
    "pydantic-ai-slim[anthropic]>=2.21.0,<3",
]
openai = [
    # The ceiling is the next MAJOR of the SDK, not the current one.
    #
    # pydantic-ai-slim moved its `openai` extra to `openai>=3.0.0` in 2.32.0,
    # which our own `<3.0.0` then contradicted: pip could satisfy neither and
    # the image stopped building. The only thing taken from the SDK directly
    # is `AsyncAzureOpenAI`, whose arguments are unchanged in 3.x, so the
    # ceiling was holding back the ecosystem rather than protecting anything.
    "openai>=2.29.0,<4.0.0",
    "pydantic-ai-slim[openai]>=2.21.0,<3",
]
google = [
    "google-auth>=2.52.0",
    "google-api-core>=2.30.3",
    "pydantic-ai-slim[google]>=2.21.0,<3",
]
aws = [
    "boto3>=1.42.96,<1.43.0",
    "pydantic-ai-slim[bedrock]>=2.21.0,<3",
]
a2a = [
    "a2a-sdk[all]>=0.3.0,<0.4.0",
    "fasta2a",
]
ui = [
    "a2ui-agent-sdk>=0.4.0",
    "ag-ui-protocol>=0.1.19",
    "agent-client-protocol>=0.7.1",
    "mcp-ui-server>=1.0.0,<1.1.0",
]
memory = [
    "mem0ai>=2.0.1",
]
durable = [
    "dbos",
    "pydantic-ai-slim[dbos]>=2.21.0,<3",
]
logfire = [
    "logfire>=4.32.1",
    "logfire-api>=4.33.0",
]
docs = [
    "npdoc_to_md>=2.0.1",
    "pydoc-markdown>=4.0",
]
examples = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "scikit-learn>=1.7.1",
    "streamlit>=1.47.1",
    "torch",
    "uvicorn",
]
cli = [
    "jupyter-nbmodel-client",
    "pillow",
    "prompt_toolkit>=3.0.0",
    "requests",
    "rich>=13.0.0",
    "textual",
]
chat = [
    "jupyter-nbmodel-client",
    "pillow",
    "prompt_toolkit>=3.0.0",
    "requests",
    "rich>=13.0.0",
    "textual",
]
agent-sudo = [
    "agent-sudo>=0.4.0rc14",
]
all = [
    "agent_runtimes[a2a,anthropic,aws,durable,google,logfire,memory,openai,ui]",
]
test = [
    "coverage>=7.9.2",
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest_jupyter>=0.10.1",
    "pytest-tornasync",
    "python-dotenv>=1.1.1",
    "types-requests>=2.32.4",
    "typing-extensions>=4.15.0",
    "datalayer_reactor",
]

[project.scripts]
datalayer-agents = "agent_runtimes.main:main"
agent-runtimes = "agent_runtimes.main:main"
loop = "agent_runtimes.main:main"
l = "agent_runtimes.main:main"

# The Datalayer CLI discovers its extensions through this group: installing
# agent-runtimes is what makes `datalayer sandboxes` (and the other command
# groups of this package) exist over there.
[project.entry-points."datalayer.cli"]
agent-runtimes = "agent_runtimes.reactor_extension:plugin"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "agent_runtimes/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["agent_runtimes/static/dist"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
artifacts = ["agent_runtimes/static/dist"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/nb-config" = "etc/jupyter/jupyter_notebook_config.d"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = false
warn_unused_ignores = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "tornado.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.handlers.chat.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "agent_runtimes.commands.evals"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.evals.saas.report"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.evals.saas.runner"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_runtimes.commands.agents"
disable_error_code = ["import-untyped"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.poetry]
version = "0.1.0"

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # No examples section found
    "SA01",  # See Also section found
    "ES01",  # No extended summary found
    "GL08",  # The object does not have a docstring
    "GL01",  # Summary placement strictness for opening triple quotes
    "PR01",  # Parameters not documented
    "PR02",  # Unknown parameters
    "RT01",  # No Returns section found
    "RT05",  # Return value description punctuation strictness
    "SS06",  # Summary should fit on a single line
]

exclude = [  # don't report on objects that match any of these regex
    '\.undocumented_method$',
    '\.__repr__$',
    '\.test_.*$',
    '\.__init__$',  # Skip __init__ methods
    '\.Config$',  # Skip Pydantic Config classes
]

exclude_files = [ # don't process filepaths that match these regex
    '^test_.*.py$',
]

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["agent_runtimes"] }
]

processors = [
    { type = "filter", skip_empty_modules = false },
    { type = "smart" },
    { type = "crossref" },
    { type = "agent_runtimes._pydoc.ReplaceProcessor" }
]

[tool.pydoc-markdown.renderer]
type = "agent_runtimes._pydoc.MyDocusaurusRenderer"
docs_base_path = "docs/docs"
relative_output_path = "python_api"
relative_sidebar_path = "sidebar.json"
sidebar_top_level_label = ""

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # Assert statements are acceptable in this codebase
    "B105",  # Hardcoded password strings - these are configuration keys, not actual passwords
    "B106",  # Hardcoded password funcarg - false positive for empty default values
    "B110",  # Try/except pass is acceptable for error handling
    "B404",  # Subprocess import is needed for legitimate process management
    "B603",  # Subprocess calls are controlled and necessary for CLI operations
    "B606",  # Process execution without shell is safer and intentional
    "B607",  # Partial path execution is acceptable for known binaries
]

[tool.interrogate]
fail-under = 79.0
exclude = ["agent_runtimes/tests", "scripts"]
