[build-system]
requires = ["hatchling==1.21.1", "hatch-nodejs-version>=0.3.2", "pip>=26.1.2"]
build-backend = "hatchling.build"

[project]
name = "agent_runtimes"
description="Agent Runtimes"
keywords = []
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The first releases of both on mcp 2; an older one pins mcp<2.
    "agent-codemode>=1.1.0",
    "agent-skills>=1.1.0",
    # `CodeExecutionOutcome.outputs` — the mime bundles the A2UI converter
    # draws from — arrived in 1.3.0; `code_sandboxes.environments`, the models
    # the environments client is typed with (PLAN_ENV.md, D-14), in 1.5.0.
    "code-sandboxes>=1.5.0",
    "croniter",
    # `datalayer_core.orchestration.Usage`, what an attempt spent as its worker
    # reported it, arrived in 1.2.2.
    # 1.2.3 is where a delegable agentspec becomes a discoverable, reachable
    # descriptor: `from_agentspec` reads the contract and gives it an A2A
    # endpoint (ORCHESTRATOR.md, O2-07). Below it, every capability query
    # answers nothing.
    "datalayer-core>=1.2.3",
    "fastapi",
    "filelock>=3.20.3",
    "httpx",
    "nbformat",
    "jupyter-server>=2.10,<3",
    # The MCP Python SDK 2. The client-side integration runs through
    # pydantic-ai, whose `mcp` extra accepts fastmcp-slim 3 (mcp 1) as well
    # as 4 (mcp 2): the fastmcp-slim floor below is what pins the mcp 2 line,
    # and it has to name the pre-release explicitly for pip to consider it.
    # See https://py.sdk.modelcontextprotocol.io/v2/migration/
    "mcp>=2,<3",
    "fastmcp-slim[client]>=4.0.0b3,<5",
    # OTEL: floors, and no ceiling below the next major.
    #
    # These six packages pin *each other* exactly — `opentelemetry-sdk 1.44.0`
    # requires `opentelemetry-api == 1.44.0` and
    # `opentelemetry-semantic-conventions == 0.65b0`, and each exporter
    # requires `opentelemetry-sdk ~= its own version`. So a ceiling here does
    # not narrow a range, it selects one release of the whole stack, and
    # anything else in the environment with an opinion about OTEL then has
    # nowhere to go. `<0.66` on the two 0.x packages was doing exactly that.
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.65b0,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
    "opentelemetry-instrumentation>=0.65b0,<1.0",
    # The agent-memories PostgreSQL a runtime on Kubernetes keeps its A2A
    # tasks and ACP sessions in (`protocol_state`); the runtime image installs
    # only these dependencies.
    "psycopg[binary]>=3.2.8",
    "pydantic-ai-slim[mcp]>=2.35.0,<3",
    "pydantic-graph>=2.35.0,<3",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.3",
    "tiktoken>=0.5.0",
    "typer>=0.16.0",
    "urllib3>=2.6.3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/datalayer/agent-runtimes"
Documentation = "https://agent-runtimes.datalayer.tech"
Repository = "https://github.com/datalayer/agent-runtimes"
Issues = "https://github.com/datalayer/agent-runtimes/issues"
Changelog = "https://github.com/datalayer/agent-runtimes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    # pydantic-ai 2.34+ builds on the anthropic SDK 1.x; nothing here calls
    # the SDK directly, so the floor follows pydantic-ai's.
    "anthropic>=1.0.0,<2.0.0",
    "pydantic-ai-slim[anthropic]>=2.35.0,<3",
]
openai = [
    # The ceiling is the next MAJOR of the SDK, not the current one.
    #
    # pydantic-ai-slim moved its `openai` extra to `openai>=3.0.0` in 2.32.0,
    # which our own `<3.0.0` then contradicted: pip could satisfy neither and
    # the image stopped building. The only thing taken from the SDK directly
    # is `AsyncAzureOpenAI`, whose arguments are unchanged in 3.x, so the
    # ceiling was holding back the ecosystem rather than protecting anything.
    "openai>=2.29.0,<4.0.0",
    "pydantic-ai-slim[openai]>=2.35.0,<3",
]
google = [
    "google-auth>=2.52.0",
    "google-api-core>=2.30.3",
    "pydantic-ai-slim[google]>=2.35.0,<3",
]
aws = [
    "boto3>=1.42.96,<1.43.0",
    "pydantic-ai-slim[bedrock]>=2.35.0,<3",
]
a2a = [
    "a2a-sdk[all]>=0.3.0,<0.4.0",
    # 2.0: the worker publishes through its helpers and leaves the end of
    # the stream to it, on Pydantic AI 2.
    "fasta2a>=2.0.0",
]
# The ACP client the orchestration adapter speaks, and the route serves.
#
# It was imported and declared nowhere — the same defect O0-17 found in
# ai-agents, and with the same failure: a dependency reached for at the
# moment of doing the work is missing in every deployment that did not
# happen to have it. The durable worker runs both adapters (19.8), so it is
# `agent-runtimes[a2a,acp]` that it needs, and neither extra is optional
# there.
acp = [
    "agent-client-protocol>=0.7.1",
]
ui = [
    "ag-ui-protocol>=0.1.19",
    "agent-client-protocol>=0.7.1",
    "mcp-ui-server>=1.0.0,<1.1.0",
]
# The A2UI reference SDK, opt-in — and out of `all` — because of what it costs
# rather than what it does.
#
# It requires `google-adk`, and every google-adk release caps
# `opentelemetry-api` and `-sdk` at `<=1.42.1`: not for itself, for the whole
# environment. Left in `all` that made `agent-runtimes[all]` unsatisfiable
# against the OTEL floor above — and pip does not report that as a conflict, it
# backtracks through every version of google-adk, a2a-sdk and datalayer-core
# hunting an escape that cannot exist.
#
# Nothing in the runtime needs it: the converter took one versioned
# specification URL from it, which `agent_runtimes/a2ui/executions.py` now
# carries as a literal it verifies against the SDK wherever the SDK is present.
# What is left is the examples, which is what this extra is for. The OTEL
# ceiling is restated here so that installing it resolves in seconds instead of
# discovering the same cap through sixty google-adk releases.
a2ui = [
    "a2ui-agent-sdk>=0.5.0",
    "opentelemetry-api<=1.42.1",
    "opentelemetry-sdk<=1.42.1",
]
memory = [
    "mem0ai>=2.0.1",
]
durable = [
    "dbos",
    "pydantic-ai-slim[dbos]>=2.35.0,<3",
]
logfire = [
    "logfire>=4.32.1",
    "logfire-api>=4.33.0",
]
docs = [
    "npdoc_to_md>=2.0.1",
    "pydoc-markdown>=4.0",
]
examples = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "scikit-learn>=1.7.1",
    "streamlit>=1.47.1",
    "torch",
    "uvicorn",
]
cli = [
    "agent-client-protocol>=0.7.1",
    "jupyter-nbmodel-client",
    "pillow",
    "keyring>=24.0.0",
    "prompt_toolkit>=3.0.0",
    "requests",
    "rich>=13.0.0",
    "textual",
]
chat = [
    "jupyter-nbmodel-client",
    "pillow",
    "keyring>=24.0.0",
    "prompt_toolkit>=3.0.0",
    "requests",
    "rich>=13.0.0",
    "textual",
]
agent-sudo = [
    "agent-sudo>=0.4.0rc14",
]
all = [
    "agent_runtimes[a2a,acp,anthropic,aws,cli,durable,google,logfire,memory,openai,ui]",
]
test = [
    # Several tests build agents from `openai:` model strings, and pydantic-ai
    # resolves those through the provider SDK -- without it they fail on import.
    # CLI tests also import the ACP client, so keep the test dependency explicit
    # instead of promoting agent-client-protocol to a core runtime dependency.
    "agent_runtimes[cli,openai]",
    "coverage>=7.9.2",
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest_jupyter>=0.10.1",
    "pytest-tornasync",
    "python-dotenv>=1.1.1",
    "types-requests>=2.32.4",
    "typing-extensions>=4.15.0",
    "datalayer_reactor",
]

[project.scripts]
datalayer-agents = "agent_runtimes.main:main"
agent-runtimes = "agent_runtimes.main:main"
loop = "agent_runtimes.main:main"
l = "agent_runtimes.main:main"

# The Datalayer CLI discovers its extensions through this group: installing
# agent-runtimes is what makes `datalayer sandboxes` (and the other command
# groups of this package) exist over there.
[project.entry-points."datalayer.cli"]
agent-runtimes = "agent_runtimes.reactor_extension:plugin"

# And through the reactor's own CLI group: `reactor sandboxes` works wherever
# both are installed, with the same plugin doing the extending.
[project.entry-points."datalayer.reactor.cli"]
agent-runtimes = "agent_runtimes.reactor_extension:plugin"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "agent_runtimes/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["agent_runtimes/static/dist"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
artifacts = ["agent_runtimes/static/dist"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/nb-config" = "etc/jupyter/jupyter_notebook_config.d"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = false
warn_unused_ignores = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "tornado.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.handlers.chat.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "agent_runtimes.commands.evals"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.evals.saas.report"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_runtimes.evals.saas.runner"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_runtimes.commands.agents"
disable_error_code = ["import-untyped"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.poetry]
version = "0.1.0"

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # No examples section found
    "SA01",  # See Also section found
    "ES01",  # No extended summary found
    "GL08",  # The object does not have a docstring
    "GL01",  # Summary placement strictness for opening triple quotes
    "PR01",  # Parameters not documented
    "PR02",  # Unknown parameters
    "RT01",  # No Returns section found
    "RT05",  # Return value description punctuation strictness
    "SS06",  # Summary should fit on a single line
]

exclude = [  # don't report on objects that match any of these regex
    '\.undocumented_method$',
    '\.__repr__$',
    '\.test_.*$',
    '\.__init__$',  # Skip __init__ methods
    '\.Config$',  # Skip Pydantic Config classes
]

exclude_files = [ # don't process filepaths that match these regex
    '^test_.*.py$',
]

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["agent_runtimes"] }
]

processors = [
    { type = "filter", skip_empty_modules = false },
    { type = "smart" },
    { type = "crossref" },
    { type = "agent_runtimes._pydoc.ReplaceProcessor" }
]

[tool.pydoc-markdown.renderer]
type = "agent_runtimes._pydoc.MyDocusaurusRenderer"
docs_base_path = "docs/docs"
relative_output_path = "python_api"
relative_sidebar_path = "sidebar.json"
sidebar_top_level_label = ""

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # Assert statements are acceptable in this codebase
    "B105",  # Hardcoded password strings - these are configuration keys, not actual passwords
    "B106",  # Hardcoded password funcarg - false positive for empty default values
    "B110",  # Try/except pass is acceptable for error handling
    "B404",  # Subprocess import is needed for legitimate process management
    "B603",  # Subprocess calls are controlled and necessary for CLI operations
    "B606",  # Process execution without shell is safer and intentional
    "B607",  # Partial path execution is acceptable for known binaries
]

[tool.interrogate]
fail-under = 79.0
exclude = ["agent_runtimes/tests", "scripts"]
