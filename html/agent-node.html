<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datalayer Agent Node</title>

    <!--
      Webpack public-path shim. Some Jupyter deps (@jupyter-widgets) assign to
      the free variable `__webpack_public_path__` at module scope. In the
      strict-mode ESM bundles Vite produces, that bare assignment throws
      `ReferenceError: __webpack_public_path__ is not defined` unless the global
      already exists. This classic (non-module) script runs before any deferred
      module script, guaranteeing the global is present first.
    -->
    <script>
      window.__webpack_public_path__ = window.__webpack_public_path__ || '';
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/agent-node-main.tsx"></script>
  </body>
</html>
