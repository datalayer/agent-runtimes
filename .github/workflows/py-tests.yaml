name: Py Tests

on:
  push:
    branches:
      - main
    paths:
      - 'agent_runtimes/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - '**/*.py'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent_runtimes/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - '**/*.py'
      - '.github/workflows/tests.yml'

  workflow_dispatch:

  # Called by the Release workflow: a tag publishes nothing until these pass.
  workflow_call:

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # In parallel; on a pull request the oldest and the newest Python, on
      # main all four.
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.13"]') || fromJSON('["3.11", "3.12", "3.13"]') }}
    steps:

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libdbus-1-dev libglib2.0-dev
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git to use https
        run: git config --global hub.protocol https

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      # Editable: a build of the package needs the frontend built first
      # (hatch_build.py refuses one without its pages), which these tests do not.
      - name: Install dev tools
        run: |
          uv pip install -e .[test]
          uv pip install dbus-python keyring secretstorage

      - name: Unlock keyring
        uses: t1m0thyj/unlock-keyring@v1

      - name: Run basic tests
        env:
          TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
          DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
        run: |
          pytest agent_runtimes/tests/ --cov=agent_runtimes --cov-report term-missing

      - name: Validate Personal Agent Protocol examples
        run: python scripts/validate_pap_examples.py

  # The external adapters, against the real framework, in the real sandbox: what
  # the job above skips, since it holds no framework and its kernel no namespaces.
  evals-adapters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libdbus-1-dev libglib2.0-dev

      # Ubuntu's AppArmor refuses unprivileged user namespaces by default; the
      # sandbox refuses to run without them, so these tests would only skip.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.13"
          activate-environment: true

      - name: Install the package
        run: uv pip install -e .[test]

      # In an environment of its own, as in the adapter's image: the pin is the
      # adapter's, read from it. tiktoken's encoding is seeded because a sandbox
      # has no network to fetch it with.
      - name: Install the pinned Inspect
        run: |
          version=$(sed -n 's/^INSPECT_VERSION = "\(.*\)"$/\1/p' agent_runtimes/evals/adapters/inspect_ai.py)
          uv venv "$RUNNER_TEMP/inspect"
          uv pip install --python "$RUNNER_TEMP/inspect/bin/python" "inspect-ai==$version" openai packaging
          TIKTOKEN_CACHE_DIR="$RUNNER_TEMP/tiktoken" "$RUNNER_TEMP/inspect/bin/python" -c "import tiktoken; tiktoken.get_encoding('o200k_base')"

      - name: Install the pinned Harbor
        run: |
          version=$(sed -n 's/^HARBOR_VERSION = "\(.*\)"$/\1/p' agent_runtimes/evals/adapters/harbor.py)
          uv venv "$RUNNER_TEMP/harbor"
          uv pip install --python "$RUNNER_TEMP/harbor/bin/python" "harbor==$version"

      - name: Run the adapter tests
        env:
          DATALAYER_INSPECT_AI_PYTHON: ${{ runner.temp }}/inspect/bin/python
          DATALAYER_INSPECT_AI_TIKTOKEN_CACHE: ${{ runner.temp }}/tiktoken
          DATALAYER_HARBOR_PYTHON: ${{ runner.temp }}/harbor/bin/python
        run: pytest agent_runtimes/tests/test_evals_adapters.py agent_runtimes/tests/test_evals_adapters_sandbox.py agent_runtimes/tests/test_evals_adapters_inspect.py agent_runtimes/tests/test_evals_adapters_harbor.py agent_runtimes/tests/test_evals_adapters_command.py
