name: TS Code Style

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src/**/*.js'
      - 'src/**/*.jsx'
      - 'examples/**/*.ts'
      - 'examples/**/*.tsx'
      - 'examples/**/*.js'
      - 'examples/**/*.jsx'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'package.json'
      - '.github/workflows/ts-code-style.yaml'
      - '.github/workflows/reusable-typescript.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src/**/*.js'
      - 'src/**/*.jsx'
      - 'examples/**/*.ts'
      - 'examples/**/*.tsx'
      - 'examples/**/*.js'
      - 'examples/**/*.jsx'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'package.json'
      - '.github/workflows/ts-code-style.yaml'
      - '.github/workflows/reusable-typescript.yaml'

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-style:
    uses: ./.github/workflows/reusable-typescript.yaml
    with:
      node-version: '22.x'
      install-command: 'npm install'
      build-command: ''  # Skip build for code style checks
      run-format-check: true
      run-lint: true
      run-type-check: false
      run-tests: false
