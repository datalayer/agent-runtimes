name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The registry times out now and then: a fetch is tried again rather than the run lost.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  typescript-build:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    strategy:
      matrix:
        # Node 24 on main: a pull request waits for one runtime, not two.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["22.x", "24.x"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.node-version || '22.x' }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-${{ matrix.node-version || '22.x' }}-

      - name: Install TypeScript dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      # The `<datalayer-app>` embed (STUDIO D-08), as the release builds it:
      # its build prints every file's size and fails over the initial load's
      # budget (vite.embed.config.ts), so a pull request sees what it costs.
      - name: Build the embed bundle
        if: matrix.node-version == '22.x'
        run: |
          set -euo pipefail
          npm run build:embed
          test -s dist-embed/datalayer-app.js
          test -s dist-embed/datalayer-app-main.js
          test -s dist-embed/datalayer-app.css

      # `tsc -b` in the build has checked the package; the workspaces here,
      # rather than in a workflow of their own that installs and builds again.
      - name: Type check the workspaces
        run: npm run type-check --workspaces --if-present

      - name: Run TypeScript tests
        env:
          TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
        # Unit and general once, with coverage; then integration — what `test:all`
        # and `test:coverage` ran between them, without running the first two twice.
        run: |
          npm run test:coverage
          npm run test:integration

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [typescript-build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.typescript-build.result }}" == "success" ]]; then
            echo "✅ All builds passed"
            exit 0
          else
            echo "❌ Some builds failed"
            echo "TypeScript build: ${{ needs.typescript-build.result }}"
            exit 1
          fi
