name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript-build:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    strategy:
      matrix:
        # Node 24 on main: a pull request waits for one runtime, not two.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["22.x", "24.x"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.node-version || '22.x' }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-${{ matrix.node-version || '22.x' }}-

      - name: Install TypeScript dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Run TypeScript tests
        env:
          TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
        # Unit and general once, with coverage; then integration — what `test:all`
        # and `test:coverage` ran between them, without running the first two twice.
        run: |
          npm run test:coverage
          npm run test:integration

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [typescript-build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.typescript-build.result }}" == "success" ]]; then
            echo "✅ All builds passed"
            exit 0
          else
            echo "❌ Some builds failed"
            echo "TypeScript build: ${{ needs.typescript-build.result }}"
            exit 1
          fi
