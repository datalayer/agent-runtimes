name: TS Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'examples/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.tsx'
      - '.github/workflows/ts-tests.yaml'
      - '.github/workflows/reusable-typescript.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'examples/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.tsx'
      - '.github/workflows/ts-tests.yaml'
      - '.github/workflows/reusable-typescript.yaml'

jobs:
  test-22x:
    uses: ./.github/workflows/reusable-typescript.yaml
    with:
      node-version: '22.x'
      install-command: 'npm install --workspaces --include-workspace-root --no-audit --no-fund'
      build-command: 'npm run build'
      run-format-check: false
      run-lint: false
      run-type-check: false
      run-tests: true
      test-command: 'npm run test:all && npm run test:coverage && npm run build:lib'
    secrets:
      TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}

  test-24x:
    needs: test-22x  # Run sequentially
    uses: ./.github/workflows/reusable-typescript.yaml
    with:
      node-version: '24.x'
      install-command: 'npm install --workspaces --include-workspace-root --no-audit --no-fund'
      build-command: 'npm run build'
      run-format-check: false
      run-lint: false
      run-type-check: false
      run-tests: true
      test-command: 'npm run test:all && npm run test:coverage && npm run build:lib'
    secrets:
      TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
