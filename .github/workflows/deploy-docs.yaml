name: Deploy docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
    
# The registry times out now and then: a fetch is tried again rather than the run lost.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Before the slow build: a page's example names a call that exists, and
      # its links to other pages resolve (docs/scripts/check_examples.py).
      - name: Check the examples
        run: python3 docs/scripts/check_examples.py

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.13"
          activate-environment: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-docs-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-docs-${{ runner.os }}-

      # The package and the doc generators — not its test or examples extras
      # (torch, scikit-learn, streamlit), which no page is generated from.
      - name: Install dependencies
        run: |
          uv pip install . pydoc-markdown
          npm install --no-audit --no-fund
          cd docs && npm install --no-audit --no-fund

      - name: Generate API docs
        run: |
          make typedoc
          make pydoc

      - name: Generate docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd docs
          npm run build

      - name: Publish docs
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # The site is built already: publish it, without building it again.
        run: |
          cd docs
          aws s3 rm s3://datalayer-agent-runtimes/ --recursive
          aws s3 cp ./build s3://datalayer-agent-runtimes/ --recursive
          aws cloudfront create-invalidation --distribution-id E1QMGQ241PAS26 --paths "/*"
