# Publishes the release a tag names, to PyPI and npm, with no stored token:
# both registries trust this workflow file (OIDC trusted publishing).
# Nothing is built before the tests (py-tests.yaml, called here) pass on
# the tagged commit. See RELEASE.md.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The registry times out now and then: a fetch is tried again rather than the run lost.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  # The tests first, through the Py Tests workflow itself (every supported
  # Python, the PAP examples): a tag whose tests fail builds and publishes
  # nothing. 1.5.35 reached PyPI unimportable because the tag was published
  # without waiting for them.
  tests:
    uses: ./.github/workflows/py-tests.yaml
    secrets: inherit

  build:
    needs: tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The Python version is not in the tree: hatch-nodejs-version reads it
      # from package.json and writes agent_runtimes/_version.py at build time.
      # So package.json is checked here, and _version.py once it is built.
      - name: Check the tag names the npm version being released
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./package.json').version")"
          echo "tag=$tag npm=$npm_version"
          test "$tag" = "$npm_version"

      - name: Install
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      # `lib/` for the npm package, `dist/` (the Vite app) for the wheel, and
      # `dist-embed/` for the npm package: the `<datalayer-app>` element's
      # script, the module and chunks it imports, and its stylesheet (D-08), versioned with the runtime it talks to. The landing copies it
      # from the package into `/embed/`. The embed's build prints every file's
      # size and fails when the initial load is over its budget
      # (vite.embed.config.ts).
      - name: Build the frontend and the embed bundle
        run: npm run build

      - name: Check the embed bundle
        run: |
          set -euo pipefail
          test -s dist-embed/datalayer-app.js
          test -s dist-embed/datalayer-app-main.js
          test -s dist-embed/datalayer-app.css
          du -sh dist-embed
          find dist-embed -type f | wc -l

      - name: Check the frontend the wheel serves is complete
        run: |
          set -euo pipefail
          test -f dist/index.html
          # Copied from @datalayer/jupyter-react when that package ships it;
          # without it the browser sandbox runs with no contents syncing.
          if [ ! -f dist/lite-service-worker.js ]; then
            echo "::warning::dist/lite-service-worker.js is missing: @datalayer/jupyter-react does not ship dist/lite-service-worker.ts"
          fi

      # What Node services and phones take of the package (lib/portable and lib/portable/hosts):
      # held to their folders and
      # tested on the tagged commit. build.yaml runs vitest on main and pull
      # requests only, and a release is tagged from a branch.
      - name: Test the portable entries
        run: npx vitest run --project=unit src/__tests__/portable.unit.test.ts src/portable/__tests__ src/portable/hosts/__tests__

      - name: Pack the npm package
        run: |
          set -euo pipefail
          mkdir -p dist-npm
          npm pack --pack-destination dist-npm
          ls dist-npm
          name="$(tar -xzOf dist-npm/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
          test "$name" = "@datalayer/agent-runtimes"
          # The embed bundle is in the package, not left behind.
          tar -tzf dist-npm/*.tgz > npm-files.txt
          grep -qx 'package/dist-embed/datalayer-app.js' npm-files.txt
          grep -qx 'package/dist-embed/datalayer-app-main.js' npm-files.txt
          grep -qx 'package/dist-embed/datalayer-app.css' npm-files.txt
          # The hosts entry Slack and Discord bundle, and the contracts they
          # read (DC-004, DC-005), are in the package.
          grep -qx 'package/lib/portable/hosts/index.js' npm-files.txt
          grep -qx 'package/lib/portable/hosts/contracts.json' npm-files.txt
          grep -qx 'package/lib/portable/semantic-events.json' npm-files.txt

      # The hatch build hook copies dist/ into agent_runtimes/static/dist, so
      # the frontend has to be built first (above). It refuses a build that
      # lacks a page the server serves, or a file such a page loads.
      - name: Build the Python package
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-py

      - name: Check the tag names the Python version being released
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          py_version="$(python -c "import re;print(re.search(r\"__version__\s*=\s*VERSION\s*=\s*'([^']+)'\", open('agent_runtimes/_version.py').read())[1])")"
          echo "tag=$tag python=$py_version"
          test "$tag" = "$py_version"
          ls dist-py
          test -f "dist-py/agent_runtimes-${tag}-py3-none-any.whl"
          test -f "dist-py/agent_runtimes-${tag}.tar.gz"
          # The pages the terminal opens (/browser, /notebook, /document), in
          # both. Listed to files first: `grep -q` closing a pipe early would
          # fail the listing under pipefail.
          unzip -Z1 "dist-py/agent_runtimes-${tag}-py3-none-any.whl" > wheel-files.txt
          tar -tzf "dist-py/agent_runtimes-${tag}.tar.gz" > sdist-files.txt
          for page in index.html agent.html agent-notebook.html agent-document.html; do
            grep -qx "agent_runtimes/static/dist/${page}" wheel-files.txt
            grep -qx "agent_runtimes-${tag}/agent_runtimes/static/dist/${page}" sdist-files.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist-npm/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist-py/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist
      - name: Publish
        run: |
          set -euo pipefail
          for tarball in dist/*.tgz; do
            # "./": npm reads a bare "dist/x.tgz" as the GitHub shorthand
            # github:dist/x.tgz and refuses to fetch it (EALLOWGIT).
            npm publish "./$tarball" --access public --provenance
          done
