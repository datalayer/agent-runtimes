name: TS Type Checking

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tsconfig*.json'
      - 'package.json'
      - '.github/workflows/ts-typing.yaml'
      - '.github/workflows/reusable-typescript.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tsconfig*.json'
      - 'package.json'
      - '.github/workflows/ts-typing.yaml'
      - '.github/workflows/reusable-typescript.yaml'

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The registry times out now and then: a fetch is tried again rather than the run lost.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  # Pull requests are type-checked by Build, which has built already.
  type-check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable-typescript.yaml
    with:
      node-version: '22.x'
      install-command: 'npm install --workspaces --include-workspace-root --no-audit --no-fund'
      build-command: 'npm run build'
      run-format-check: false
      run-lint: false
      run-type-check: true
      run-tests: false
    secrets:
      TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}

  strict-mode-check:
    # A report, not a gate (continue-on-error): on main, not on every pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: type-check
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm install --workspaces --include-workspace-root --no-audit --no-fund

    - name: Build project
      run: npm run build
      env:
        TEST_DATALAYER_API_KEY: ${{ secrets.TEST_DATALAYER_API_KEY }}
        DATALAYER_TEST_RUN_EXPENSIVE: ${{ secrets.TEST_DATALAYER_API_KEY != '' && 'true' || 'false' }}

    - name: Check TypeScript strict mode compliance
      run: npx tsc --noEmit --strict
      continue-on-error: true

    - name: Generate type coverage report
      run: npx type-coverage --detail
      continue-on-error: true
